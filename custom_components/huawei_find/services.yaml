refresh:
  fields:
    entry_id:
      example: "01M68GNRAS24MZPDJ9H0SWHGFB"
      required: false
      selector:
        config_entry:
          integration: huawei_find
    device_id:
      required: false
      selector:
        device:
          integration: huawei_find
set_cookie:
  fields:
    cookie:
      example: "CSRFToken=...; USER_ID=..."
      required: true
      selector:
        text:
          multiline: true
    entry_id:
      example: "01M68GNRAS24MZPDJ9H0SWHGFB"
      required: false
      selector:
        config_entry:
          integration: huawei_find

refresh_cookie:
  fields:
    entry_id:
      example: "01M68GNRAS24MZPDJ9H0SWHGFB"
      required: false
      selector:
        config_entry:
          integration: huawei_find
    update:
      example: true
      default: true
      required: false
      selector:
        boolean:
